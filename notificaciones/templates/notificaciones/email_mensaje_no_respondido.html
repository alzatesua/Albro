<div style="font-family: Arial, sans-serif; max-width: 480px; margin: auto;">
  <h2>Tienes un mensaje sin responder</h2>
  <p>Hola {{ profesional_nombre }},</p>
  <p><strong>{{ cliente_nombre }}</strong> te escribió y aún no has respondido:</p>
  <blockquote style="border-left:3px solid #ccc;padding-left:10px;color:#555;">{{ contenido }}</blockquote>
  <p><a href="{{ url_chat }}" style="background:#4a7dfc;color:#fff;padding:10px 18px;text-decoration:none;border-radius:6px;">Responder</a></p>
</div>
