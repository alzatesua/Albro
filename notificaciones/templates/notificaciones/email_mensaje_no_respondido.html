<div style="background-color:#f3f4f6; padding:32px 16px; font-family: Arial, sans-serif;">
  <div style="max-width:480px; margin:auto; background:#ffffff; border-radius:12px; overflow:hidden; border:1px solid #e5e7eb;">

    <!-- Header -->
    <div style="background-color:#12122b; padding:24px 28px;">
      <span style="color:#ffffff; font-size:20px; font-weight:700;">Albro</span>
    </div>

    <!-- Contenido -->
    <div style="padding:28px;">
      <p style="margin:0 0 16px 0; color:#18181b; font-size:15px;">
        Hola <strong>{{ profesional_nombre }}</strong>,
      </p>

      <p style="margin:0 0 20px 0; color:#3f3f46; font-size:14px; line-height:1.5;">
        <strong>{{ cliente_nombre }}</strong> te escribió y aún no has respondido:
      </p>

      <!-- Mensaje citado -->
      <div style="border:1px solid #e5e7eb; border-radius:8px; padding:16px 20px; margin-bottom:24px;">
        <p style="margin:0; color:#52525b; font-size:14px; font-style:italic; line-height:1.5;">
          {{ contenido }}
        </p>
      </div>

      <!-- Botón -->
      <a href="{{ url_chat }}" style="display:inline-block; background:#12122b; color:#ffffff; padding:11px 22px; text-decoration:none; border-radius:8px; font-size:14px; font-weight:600;">
        Responder
      </a>
    </div>

    <!-- Footer -->
    <div style="background-color:#f9fafb; padding:16px 28px; text-align:center; border-top:1px solid #e5e7eb;">
      <p style="margin:0; color:#a1a1aa; font-size:12px;">
        Albro · Este es un correo automático, por favor no respondas directamente.
      </p>
    </div>

  </div>
</div>
